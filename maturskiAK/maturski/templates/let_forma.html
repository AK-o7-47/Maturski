<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if let %}Izmena leta{% else %}Dodavanje leta{% endif %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style2.css') }}">
</head>
<body>
    <header>
        <h1>{% if let %}Izmena leta{% else %}Dodavanje leta{% endif %}</h1>
    </header>

    <main class="container">
        <section class="form-box">
            <form method="POST" class="crud-form">
                <input type="text" name="broj_leta" placeholder="Broj leta" value="{{ let.broj_leta if let else '' }}" required>
                <input type="text" name="aviokompanija" placeholder="Aviokompanija" value="{{ let.aviokompanija if let else '' }}" required>

                <select name="tip_aviona" required>
                    <option value="">-- Izaberite avion --</option>
                    {% for a in avioni %}
                    <option value="{{ a.id }}" {% if let and let.tip_aviona == a.id %}selected{% endif %}>
                        {{ a.naziv }} ({{ a.brojSedista }} sedišta)
                    </option>
                    {% endfor %}
                </select>

                <select name="polaziste_id" required>
                    <option value="">-- Polazište --</option>
                    {% for a in aerodromi %}
                    <option value="{{ a.id }}" {% if let and let.polaziste_id == a.id %}selected{% endif %}>
                        {{ a.grad }} ({{ a.iata_kod }})
                    </option>
                    {% endfor %}
                </select>

                <select name="odrediste_id" required>
                    <option value="">-- Odredište --</option>
                    {% for a in aerodromi %}
                    <option value="{{ a.id }}" {% if let and let.odrediste_id == a.id %}selected{% endif %}>
                        {{ a.grad }} ({{ a.iata_kod }})
                    </option>
                    {% endfor %}
                </select>

                <input type="text" name="datum_polaska" placeholder="YYYY-MM-DD HH:MM" value="{{ let.datum_polaska if let else '' }}" required>
                <input type="text" name="datum_dolaska" placeholder="YYYY-MM-DD HH:MM" value="{{ let.datum_dolaska if let else '' }}" required>
                <input type="number" step="0.01" name="cena" placeholder="Cena" value="{{ let.cena if let else '' }}" required>
                <input type="number" name="broj_slobodnih_mesta" placeholder="Broj slobodnih mesta" value="{{ let.broj_slobodnih_mesta if let else '' }}" required>

                <button type="submit">Sačuvaj</button>
                <a href="{{ url_for('lista_letova') }}">Nazad</a>
            </form>
        </section>
    </main>

    <footer>
        Maturski rad Aleksa Kostadinović
    </footer>
</body>
</html>
